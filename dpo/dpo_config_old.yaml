model:
  config:
    _set_:
      dropout_p: 0.0
  _set_:
    name: llama3_1_8b_instruct
    family: null
    arch: null
    checkpoint: null
dataset:
  _set_:
    name: dpo_rip
    path: /home/chuanyang/data/Wildchat-RIP-Filtered-by-8b-Llama.jsonl
    family: generic_preference
    source_encode_mode: prompt
    target_encode_mode: prompt_response
    mask_source_tokens: true
    min_seq_len: 1
    max_seq_len: 8192
    max_num_tokens: 16384
    batch_size: 1
    example_shuffle_window: 10000
    batch_shuffle_window: 1000
    num_prefetch: 4
    extras: {}
gang:
  _set_:
    tensor_parallel_size: 1
    timeout: 15
    high_priority: true
    monitored: false
trainer:
  fsdp:
    _set_:
      version: v1
      granularity: layer
      hsdp: false
      reshard_after_forward: true
      fp32_reduce: true
  _set_:
    dtype: bfloat16
    data_parallelism: fsdp
    mixed_precision: static
    gradient_accumulation: 4
    activation_checkpointing: true
    max_gradient_norm: 1.0
    fp16_loss_scale:
    - 128.0
    - 0.0001
    gc_every_n_steps: null
    profile: null
    gradient_check: false
    anomaly_detection: false
criterion:
  config:
    reference_model:
      _set_:
        name: llama3_1_8b_instruct
    _set_:
      reference_dtype: bfloat16
      beta: 0.1
      nll_scale: 0.0
      length_normalization: false
  _set_:
    name: dpo
optimizer:
  config:
    _set_:
      lr: 1e-7
      betas:
      - 0.9
      - 0.95
      eps: 1.0e-08
      weight_decay: 0.1
      amsgrad: false
      maximize: false
      capturable: false
      differentiable: false
      impl: auto
      use_fp32: false
  _set_:
    name: adamw
lr_scheduler:
  config:
    _set_:
      cycle_len: null
      num_warmup_steps: 30
      cycle_mul: 1.0
      lr_mul: 1.0
      start_lr: 0.0
      final_lr: null
      final_lr_scale: null
  _set_:
    name: cosine_annealing
regime:
  _set_:
    num_steps: 2000
    num_data_epochs: 100
    score_metric: null
    lower_score_better: false
    validate_after_n_steps: 0
    validate_every_n_steps: null
    validate_after_n_data_epochs: 0
    validate_every_n_data_epochs: null
    checkpoint_after_n_steps: 0
    checkpoint_every_n_steps: 200
    checkpoint_after_n_data_epochs: 0
    checkpoint_every_n_data_epochs: 2
    keep_last_n_checkpoints: 1
    keep_best_n_checkpoints: null
    keep_last_n_models: 100000
    keep_best_n_models: null
    publish_metrics_after_n_steps: 0
    publish_metrics_every_n_steps: 1
    publish_metrics_after_n_data_epochs: 1
    publish_metrics_every_n_data_epochs: null
common:
  metric_recorders:
    log:
      _set_:
        enabled: true
    jsonl:
      _set_:
        enabled: true
    tensorboard:
      _set_:
        enabled: true
    wandb:
      _set_:
        enabled: false
        project: null
        run: null
  profilers:
    torch:
      _set_:
        enabled: false
        skip_n_steps: 4
        wait_n_steps: 0
        num_warmup_steps: 1
        num_active_steps: 4
        repeat: 1
  assets:
    _set_:
      extra_path: null
      checkpoint_dir: null
  _set_:
    seed: 2